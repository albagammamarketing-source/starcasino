name: Run STARCASINO Script

on:
  schedule:
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run promo script
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PIPELINE_DB_USER: ${{ secrets.PIPELINE_DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PIPELINE_DB_HOST: ${{ secrets.PIPELINE_DB_HOST }}
          PIPELINE_DB_PORT: ${{ secrets.PIPELINE_DB_PORT }}
        run: |
          python promo.py

      - name: Commit output files
        run: |
          git pull

          git add output/

          git commit -m "Aggiornamento automatico CSV" || echo "Nessuna modifica"

          git push
